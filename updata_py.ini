announcement=修复 皮肤交换角色图片资源无法更新的问题\n修复 Mod列表鼠标悬停角色栏显示的角色图片异常的问题\n修复 win10系统下，部分窗口运行日志底色显示异常问题\n修复 默认缓存路径会导致后续设置路径时导致失效的问题\n修复 Mod图表中部分妮姬角色头像显示异常的问题\n修复 皮肤交换、重新打包操作时，如果未先前设置游戏路径会导致操作异常失败的问题\n修复 部分Mod隐藏骨骼导出不生效的问题(请点击隐藏骨骼图标后导出)\n修复 皮肤交换中的部分逻辑导致交换异常的问题\n修复 预览特殊Mod时无法预览或报错的问题\n修复 在Mod列表/图表激活/关闭某个Mod后切换至另一个表格时不同步的问题\n修复 游戏更新资源逻辑后导致的无法应用Mod和获取各文件数据的问题\n新增 本地化应用Mod逻辑，现在无需等待NMM服务器更新\n新增 对私服/单机版游戏的应用Mod支持（测试）\n新增 本地化重新打包、皮肤交换数据获取、更新逻辑，并随游戏同步更新\n新增 热应用Mod-即在游戏运行时应用Mod即可生效(首次使用NMM仍需重启游戏)\n新增 Mod界面中鼠标放置到角色栏时悬浮窗中添加妮姬皮肤名称\n新增 让游戏在窗口标题显示部分系统状态的功能\n新增 让游戏大厅动画以全屏方式显示的功能(需配合特定Mod使用)\n新增 让游戏爆裂动画以全屏方式显示的功能(需配合特定Mod使用)(by_Xanye)\n新增 角色语音和字幕交换、自定义的功能界面\n新增 event、favorite、lobby、burst类型的Mod适配对应头像、图片、名称\n新增 皮肤交换逻辑中，添加音效交换逻辑 (by_NixMultitool)\n新增 NPC角色Mod的命名和应用Mod支持\n新增 全新Mod图表界面UI，在角色卡中显示更多信息\n新增 高缩放比例下的界面UI显示适配（测试）\n新增 总览界面，显示Mod使用情况与当前游戏活动\n新增 全新皮肤交换界面UI，增加显示角色名称、皮肤名称和编号\n新增 全新重新打包界面，优化UI和部分操作逻辑使其在操作上更方便\n新增 在应用Mod时，同时对播放简易动画中的角色立绘应用Mod\n新增 故障排除功能，如出现非Mod的游戏问题可以尝试修复\n新增 头像交换功能，现在可以自由替换每个角色的头像\n新增 资源提取功能，现在可以下载各种想要的游戏资源文件\n优化 应用Mod后，退出游戏延迟几秒的问题，现已可以做到“闪退”\n优化 win10系统下，部分UI显示异常的问题\n优化 各数据获取逻辑，使其跟随官方同步更新\n优化 底层代码使其运行更流畅，减少操作时的卡顿问题\n优化 界面切换动画的平滑度和流畅度\n优化 大部分操作逻辑，使其更便民
announcement_tw=修復 皮膚交換角色圖片資源無法更新的問題\n修復 Mod列表鼠標懸停角色欄顯示的角色圖片異常的問題\n修復 win10系統下，部分窗口運行日誌底色顯示異常問題\n修復 默認緩存路徑會導致後續設置路徑時導致失效的問題\n修復 Mod圖表中部分妮姬角色頭像顯示異常的問題\n修復 皮膚交換、重新打包操作時，如果未先前設置遊戲路徑會導致操作異常失敗的問題\n修復 部分Mod隱藏骨骼導出不生效的問題(請點擊隱藏骨骼圖標後導出)\n修復 皮膚交換中的部分邏輯導致交換異常的問題\n修復 預覽特殊Mod時無法預覽或報錯的問題\n修復 在Mod列表/圖表激活/關閉某個Mod後切換至另一個表格時不同步的問題\n修復 遊戲更新資源邏輯後導致的無法應用Mod和獲取各文件數據的問題\n新增 本地化應用Mod邏輯，現在無需等待NMM服務器更新\n新增 對私服/單機版遊戲的應用Mod支持（測試）\n新增 本地化重新打包、皮膚交換數據獲取、更新邏輯，並隨遊戲同步更新\n新增 熱應用Mod-即在遊戲運行時應用Mod即可生效(首次使用NMM仍需重啓遊戲)\n新增 Mod界面中鼠標放置到角色欄時懸浮窗中添加妮姬皮膚名稱\n新增 讓遊戲在窗口標題顯示部分系統狀態的功能\n新增 讓遊戲大廳動畫以全屏方式顯示的功能(需配合特定Mod使用)\n新增 讓遊戲爆裂動畫以全屏方式顯示的功能(需配合特定Mod使用)(by_Xanye)\n新增 角色語音和字幕交換、自定義的功能界面\n新增 event、favorite、lobby、burst類型的Mod適配對應頭像、圖片、名稱\n新增 皮膚交換邏輯中，添加音效交換邏輯 (by_NixMultitool)\n新增 NPC角色Mod的命名和應用Mod支持\n新增 全新Mod圖表界面UI，在角色卡中顯示更多信息\n新增 高縮放比例下的界面UI顯示適配（測試）\n新增 總覽界面，顯示Mod使用情況與當前遊戲活動\n新增 全新皮膚交換界面UI，增加顯示角色名稱、皮膚名稱和編號\n新增 全新重新打包界面，優化UI和部分操作邏輯使其在操作上更方便\n新增 在應用Mod時，同時對播放簡易動畫中的角色立繪應用Mod\n新增 故障排除功能，如出現非Mod的遊戲問題可以嘗試修復\n新增 頭像交換功能，現在可以自由替換每個角色的頭像\n新增 資源提取功能，現在可以下載各種想要的遊戲資源文件\n優化 應用Mod後，退出遊戲延遲幾秒的問題，現已可以做到“閃退”\n優化 win10系統下，部分UI顯示異常的問題\n優化 各數據獲取邏輯，使其跟隨官方同步更新\n優化 底層代碼使其運行更流暢，減少操作時的卡頓問題\n優化 界面切換動畫的平滑度和流暢度\n優化 大部分操作邏輯，使其更便民
announcement_en=- Fixed an issue where character image assets could not be updated in Skin Swap.\n- Fixed incorrect character images being displayed in the hover popup when hovering over the character column in the Mod List.\n- Fixed an issue on Windows 10 where the background color of runtime logs was displayed incorrectly in some windows.\n- Fixed an issue where the default cache path could cause subsequently configured paths to become invalid.\n- Fixed an issue where some NIKKE character portraits were displayed incorrectly in the Mod Chart.\n- Fixed an issue where Skin Swap and Repacking could fail unexpectedly if the game path had not been configured beforehand.\n- Fixed an issue where exporting hidden bones did not work for some Mods. (Please click the Hide Bones icon before exporting.)\n- Fixed several logic issues in Skin Swap that could cause swaps to behave incorrectly.\n- Fixed an issue where some special Mods could not be previewed or caused errors during preview.\n- Fixed an issue where enabling/disabling a Mod in the Mod List/Chart would not stay synchronized after switching to another table.\n- Fixed an issue where changes to the game's resource update logic prevented Mods from being applied and file data from being retrieved correctly.\n- Added localized Mod application logic. NMM no longer needs to wait for server-side updates to apply Mods.\n- Added Mod application support for private-server and offline versions of the game. (Experimental)\n- Added localized data retrieval and update logic for Repacking and Skin Swap, with updates synchronized with the game.\n- Added Hot Mod Application, allowing Mods to take effect while the game is running. (The game still needs to be restarted the first time NMM is used.)\n- Added NIKKE skin names to the popup shown when hovering over the character column in the Mod interface.\n- Added an option to display certain system statuses in the game window title.\n- Added an option to display lobby animations in fullscreen mode. (Requires compatible Mods.)\n- Added an option to display Burst animations in fullscreen mode. (Requires compatible Mods.) — by _Xanye\n- Added a new interface for swapping and customizing character voices and subtitles.\n- Added proper portrait, image, and name support for `event`, `favorite`, `lobby`, and `burst` Mod types.\n- Added sound-effect swapping to the Skin Swap system. — by _NixMultitool\n- Added naming and Mod application support for NPC character Mods.\n- Added a completely redesigned Mod Chart UI, displaying more information on character cards.\n- Added UI scaling improvements for high display scaling settings. (Experimental)\n- Added a new Overview page showing Mod usage and current in-game events.\n- Added a completely redesigned Skin Swap UI, now displaying character names, skin names, and IDs.\n- Added a completely redesigned Repacking UI, with an improved layout and workflow for easier operation.\n- Added support for applying Mods to character artwork used in simplified animations when applying Mods.\n- Added a Troubleshooting feature that can attempt to repair game issues unrelated to Mods.\n- Added a Portrait Swap feature, allowing each character's portrait to be freely replaced.\n- Added a Resource Extraction feature, allowing various game resource files to be downloaded as needed.\n- Improved the delay when exiting the game after applying Mods. The game can now close almost instantly.\n- Improved various UI display issues on Windows 10.\n- Improved data retrieval logic to keep it synchronized with official game updates.\n- Optimized the underlying code for smoother performance and reduced stuttering during operations.\n- Improved the smoothness and responsiveness of interface transition animations.\n- Improved the workflow and usability of most operations to make NMM easier and more convenient to use.
limit=1
